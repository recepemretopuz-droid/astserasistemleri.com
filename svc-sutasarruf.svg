<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(455,220)">
      <!-- big droplet outline -->
      <path d="M345 60 C345 60 520 300 520 430 C520 560 420 660 295 660 C170 660 70 560 70 430 C70 300 245 60 245 60 Z"
            fill="none" stroke="url(#acc)" stroke-width="18" stroke-linejoin="round"/>
      <!-- leaf -->
      <path d="M590 420 C700 360 820 380 860 500 C740 560 640 540 590 420 Z" fill="url(#acc)" opacity=".18"/>
      <path d="M590 420 C700 360 820 380 860 500 C740 560 640 540 590 420 Z" fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="12" stroke-linejoin="round"/>
      <path d="M620 450 C700 470 760 470 820 490" fill="none" stroke="#0f172a" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
      <!-- small gauge line -->
      <path d="M160 500 C210 560 250 585 330 600" fill="none" stroke="#0f172a" stroke-opacity=".25" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

</svg>
