<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(430,240)">
      <!-- pipe -->
      <path d="M120 520 H520 C590 520 640 470 640 400 V250" fill="none" stroke="#0f172a" stroke-opacity=".55" stroke-width="22" stroke-linecap="round"/>
      <path d="M120 520 H520 C590 520 640 470 640 400 V250" fill="none" stroke="url(#acc)" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
      <!-- droplet -->
      <path d="M820 250 C820 250 920 400 920 480 C920 560 862 620 790 620 C718 620 660 560 660 480 C660 400 760 250 760 250 Z"
            fill="url(#acc)" opacity=".18" />
      <path d="M790 280 C790 280 900 430 900 490 C900 555 852 610 790 610 C728 610 680 555 680 490 C680 430 790 280 790 280 Z"
            fill="none" stroke="url(#acc)" stroke-width="16" stroke-linejoin="round"/>
      <path d="M760 520 C770 548 790 562 820 562" fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

</svg>
