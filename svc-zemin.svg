<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(420,220)">
      <rect x="120" y="240" width="920" height="420" rx="34" fill="url(#acc)" opacity=".10"/>
      <rect x="120" y="240" width="920" height="420" rx="34" fill="none" stroke="rgba(22,163,74,.35)" stroke-width="10"/>
      <!-- grid -->
      <g stroke="#0f172a" stroke-opacity=".20" stroke-width="10">
        <path d="M260 240 V660"/>
        <path d="M400 240 V660"/>
        <path d="M540 240 V660"/>
        <path d="M680 240 V660"/>
        <path d="M820 240 V660"/>
        <path d="M960 240 V660"/>
        <path d="M120 360 H1040"/>
        <path d="M120 480 H1040"/>
        <path d="M120 600 H1040"/>
      </g>
      <path d="M220 700 H940" stroke="url(#acc)" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    </g>
  </g>

</svg>
