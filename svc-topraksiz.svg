<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(430,220)">
      <!-- tray -->
      <rect x="80" y="500" width="860" height="140" rx="30" fill="url(#acc)" opacity=".14"/>
      <rect x="80" y="500" width="860" height="140" rx="30" fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="12"/>
      <!-- water waves -->
      <path d="M140 560 C200 520 260 520 320 560 C380 600 440 600 500 560 C560 520 620 520 680 560 C740 600 800 600 860 560"
            fill="none" stroke="url(#acc)" stroke-width="14" stroke-linecap="round" opacity=".9"/>
      <!-- plant -->
      <path d="M520 500 V360" stroke="#0f172a" stroke-opacity=".45" stroke-width="14" stroke-linecap="round"/>
      <path d="M520 380 C500 320 430 300 380 330 C410 400 470 420 520 380 Z" fill="url(#acc)" opacity=".22"/>
      <path d="M520 380 C500 320 430 300 380 330 C410 400 470 420 520 380 Z" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linejoin="round"/>
      <path d="M520 400 C560 330 640 320 700 350 C660 420 600 440 520 400 Z" fill="url(#acc)" opacity=".22"/>
      <path d="M520 400 C560 330 640 320 700 350 C660 420 600 440 520 400 Z" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linejoin="round"/>
    </g>
  </g>

</svg>
