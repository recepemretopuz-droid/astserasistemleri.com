<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(420,210)">
      <!-- floor plate -->
      <rect x="160" y="420" width="840" height="240" rx="34" fill="url(#acc)" opacity=".10"/>
      <rect x="160" y="420" width="840" height="240" rx="34" fill="none" stroke="#0f172a" stroke-opacity=".25" stroke-width="12"/>
      <!-- shine -->
      <path d="M240 520 C360 470 520 470 660 520" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linecap="round" opacity=".9"/>
      <!-- epoxy drop -->
      <path d="M660 120 C660 120 820 340 820 460 C820 560 740 640 640 640 C540 640 460 560 460 460 C460 340 620 120 620 120 Z"
            fill="url(#acc)" opacity=".18"/>
      <path d="M640 160 C640 160 780 350 780 455 C780 535 720 600 640 600 C560 600 500 535 500 455 C500 350 640 160 640 160 Z"
            fill="none" stroke="url(#acc)" stroke-width="16" stroke-linejoin="round"/>
      <path d="M610 500 C620 525 640 540 670 540" fill="none" stroke="#0f172a" stroke-opacity=".30" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

</svg>
