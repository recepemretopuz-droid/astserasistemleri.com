<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(420,240)">
      <path d="M380 0 L760 260 V560 H0 V260 Z" fill="url(#acc)" opacity=".12"/>
      <path d="M0 260 L380 0 L760 260" fill="none" stroke="url(#acc)" stroke-width="16" stroke-linejoin="round"/>
      <path d="M60 260 V520 H700 V260" fill="none" stroke="#0f172a" stroke-opacity=".70" stroke-width="14" stroke-linejoin="round"/>
      <path d="M160 320 H600 M160 400 H600 M160 480 H600" stroke="#0f172a" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
      <path d="M280 260 V520 M380 260 V520 M480 260 V520" stroke="#0f172a" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
      <path d="M120 560 C170 470, 250 430, 340 460 C430 490, 520 470, 640 420" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>

</svg>
