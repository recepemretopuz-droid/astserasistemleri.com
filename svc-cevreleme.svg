<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <!-- single clean plate -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="#ffffff"/>
    <rect x="160" y="140" width="1280" height="620" rx="44" fill="none" stroke="rgba(22,163,74,.20)" stroke-width="6"/>
  </g>

  
  <g transform="translate(0,0)">
    <g transform="translate(380,240)">
      <!-- fence posts -->
      <g fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M240 560 V260"/>
        <path d="M380 560 V260"/>
        <path d="M520 560 V260"/>
        <path d="M660 560 V260"/>
        <path d="M800 560 V260"/>
        <path d="M940 560 V260"/>
        <path d="M240 320 H940"/>
        <path d="M240 420 H940"/>
        <path d="M240 520 H940"/>
      </g>
      <!-- accent rails -->
      <path d="M240 360 H940" stroke="url(#acc)" stroke-width="16" stroke-linecap="round" opacity=".85"/>
      <path d="M240 480 H940" stroke="url(#acc)" stroke-width="16" stroke-linecap="round" opacity=".65"/>
    </g>
  </g>

</svg>
